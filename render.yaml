services:
  - type: web
    name: hanafuda-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ORCAROUTER_API_KEY
        sync: false
      - key: ORCAROUTER_BASE_URL
        value: https://api.orcarouter.ai/v1
      - key: ORCAROUTER_MODEL
        value: orcarouter/auto
      - key: DECK_PROVIDER
        value: orca
