    "pyyaml==6.0.3",
    "rich==15.0.0",
    "rich-toolkit==0.20.5",
    "rignore==0.8.1",
    "sentry-sdk==2.69.2",
    "shellingham==1.5.4",
    "starlette==0.49.3",
    "tomli==2.4.1",
    "typer==0.23.2",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
    "urllib3==2.6.3",
